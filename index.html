      --primary: #B83B5E;

      --accent: #F08A5D;
      --accent-hover: #D97448;
      --border-col: #F3D7E0;

    body {

      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .font-jp {
      font-family: 'Noto Sans JP', 'Noto Sans Thai', sans-serif;
    }

    .bg-theme-main { background-color: var(--bg-main); }
    .bg-theme-sub { background-color: var(--bg-sub); }

    .bg-theme-primary:hover { background-color: var(--primary-hover); }
    .bg-theme-accent { background-color: var(--accent); color: #fff; }
    .bg-theme-accent:hover { background-color: var(--accent-hover); }
    .text-theme-primary { color: var(--primary); }
    .text-theme-accent { color: var(--accent); }
    .border-theme { border-color: var(--border-col); }

      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.22s ease-out forwards;
    }

    // Joined Vocabulary + UserVocabulary for Current User
    function getUserJoinedVocabulary() {
      const uid = getCurrentUser().id;
      const vocabItems = db.Vocabulary.filter(v => v.ownerId === uid);
      const progressMap = {};
      db.UserVocabulary.filter(uv => uv.userId === uid).forEach(uv => {
        progressMap[uv.vocabId] = uv;
      });

      return vocabItems.map(v => {
        const prog = progressMap[v.id] || {
          id: 'uv_' + v.id,
          userId: uid,
          vocabId: v.id,
          srsStage: 0,
          nextReview: null,
          lastReviewed: null,
          correctCount: 0,
          wrongCount: 0,
          consecutiveCorrect: 0,
          urgentReview: false
        };
        return {
          ...v,
          srsStage: prog.srsStage || 0,
          nextReview: prog.nextReview || null,
          lastReviewed: prog.lastReviewed || null,
          correctCount: prog.correctCount || 0,
          wrongCount: prog.wrongCount || 0,
          consecutiveCorrect: prog.consecutiveCorrect || 0,
          urgentReview: Boolean(prog.urgentReview)
        };
      });

    /****************************************************
     * 3. TIMEZONE (Asia/Bangkok) & SPEECH API HELPERS
     ****************************************************/
    function getBangkokDateStr(ts = Date.now()) {
      try {
        return new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Bangkok',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).format(new Date(ts));
      } catch (e) {
        return new Date(ts).toISOString().split('T')[0];
      }
    }

    function formatBangkokDateTime(ts) {
      if (!ts) return 'ยังไม่ได้กำหนด';
      try {
        return new Intl.DateTimeFormat('th-TH', {
          timeZone: 'Asia/Bangkok',
          day: 'numeric',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit'
        }).format(new Date(ts));
      } catch (e) {
        return new Date(ts).toLocaleString('th-TH');
      }
    }

    function initSpeechSystem() {
      if ('speechSynthesis' in window) {
        speechState.supported = true;
        const loadVoices = () => {
          const voices = window.speechSynthesis.getVoices();
          const ja = voices.find(v => v.lang && (v.lang.includes('ja') || v.lang.includes('JP')));
          speechState.jaVoice = ja || null;
        };

        window.speechSynthesis.onvoiceschanged = loadVoices;

    function speakText(text) {

        window.speechSynthesis.cancel();

    /****************************************************
     * 4. SPACED REPETITION (SRS 10 STAGES) & RECORDING
     ****************************************************/
    function computeNextSRS(currentStage, rating, consecutiveCorrect, wasMastered) {
      const now = Date.now();
      let nextStage = currentStage;
      let nextIntervalMs = 0;
      let urgentReview = false;
      let newConsecutive = consecutiveCorrect || 0;

      if (rating === 'again') {
        // ตอบผิดหรือจำไม่ได้: ลดระดับความจำ และกำหนดเวลาทบทวนใหม่ให้เร็วขึ้น
        nextStage = Math.max(1, currentStage - 2);
        nextIntervalMs = 5 * 60 * 1000; // 5 นาที (เร่งด่วน)
        newConsecutive = 0;
        if (wasMastered || currentStage >= 5) {
          urgentReview = true;
        }
      } else if (rating === 'hard') {
        // ตอบถูกแต่ลังเล: เพิ่มช่วงเวลาเพียงเล็กน้อย
        nextStage = currentStage === 0 ? 1 : currentStage;
        const base = SRS_INTERVALS_MS[nextStage] || (30 * 60 * 1000);
        nextIntervalMs = Math.round(base * 0.6);
        newConsecutive = 0;
      } else if (rating === 'good') {
        // ตอบถูกและมั่นใจ: ขยายช่วงเวลาตามระดับความจำ
        newConsecutive += 1;
        const bonusStep = newConsecutive >= 4 ? 2 : 1;
        nextStage = currentStage === 0 ? 2 : Math.min(10, currentStage + bonusStep);
        nextIntervalMs = SRS_INTERVALS_MS[nextStage];
      } else if (rating === 'easy') {
        // จำได้ง่ายมาก: ข้ามระดับเร็วขึ้น
        newConsecutive += 1;
        nextStage = currentStage === 0 ? 3 : Math.min(10, currentStage + 2);
        nextIntervalMs = Math.round(SRS_INTERVALS_MS[nextStage] * 1.15);
      }

      return {
        srsStage: nextStage,
        nextReview: now + nextIntervalMs,
        consecutiveCorrect: newConsecutive,
        urgentReview
      };
    }

    // Record review & update XP/Streak/Tables (with anti-farming guard)
    function recordReviewResult(vocabId, rating, source = 'srs', timeSpentSec = 6) {
      const user = getCurrentUser();
      const now = Date.now();
      const todayStr = getBangkokDateStr(now);
      const yesterdayStr = getBangkokDateStr(now - 86400000);

      // Anti-repeat XP farming check (prevent rapid duplicate submission of exact same word within 3 seconds)
      const actionKey = `${vocabId}_${rating}_${Math.floor(now / 3000)}`;
      if (srsSession.lastActionHash === actionKey) return;
      srsSession.lastActionHash = actionKey;

      let uv = db.UserVocabulary.find(item => item.userId === user.id && item.vocabId === vocabId);
      if (!uv) {
        uv = {
          id: 'uv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          userId: user.id,
          vocabId,
          srsStage: 0,
          nextReview: now,
          lastReviewed: null,
          correctCount: 0,
          wrongCount: 0,
          consecutiveCorrect: 0,
          urgentReview: false
        };
        db.UserVocabulary.push(uv);
      }

      const prevStage = uv.srsStage || 0;
      const wasMastered = prevStage >= 7;
      const isCorrect = rating !== 'again';

      const nextSRS = computeNextSRS(prevStage, rating, uv.consecutiveCorrect, wasMastered);
      uv.srsStage = nextSRS.srsStage;
      uv.nextReview = nextSRS.nextReview;
      uv.lastReviewed = now;
      uv.consecutiveCorrect = nextSRS.consecutiveCorrect;
      uv.urgentReview = nextSRS.urgentReview;
      if (isCorrect) uv.correctCount = (uv.correctCount || 0) + 1;
      else uv.wrongCount = (uv.wrongCount || 0) + 1;

      const vocabObj = db.Vocabulary.find(v => v.id === vocabId);

      // Insert into ReviewHistory
      db.ReviewHistory.push({
        id: 'rev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        userId: user.id,
        vocabId,
        word: vocabObj ? vocabObj.word : '',
        category: vocabObj ? vocabObj.category : 'ทั่วไป',
        rating,
        isCorrect,
        prevStage,
        newStage: nextSRS.srsStage,
        source,
        timeSpentSec,
        timestamp: now,
        dateStr: todayStr
      });

      // Update DailyGoals table
      let daily = db.DailyGoals.find(d => d.userId === user.id && d.dateStr === todayStr);
      const settings = getCurrentUserSettings();
      if (!daily) {
        daily = {
          id: 'dg_' + user.id + '_' + todayStr,
          userId: user.id,
          dateStr: todayStr,
          targetCount: settings.dailyGoal || 15,
          completedCount: 1
        };
        db.DailyGoals.push(daily);
      } else {
        daily.completedCount += 1;
      }

      // Update User XP, Coins & Streak
      const xpEarned = rating === 'easy' ? 12 : rating === 'good' ? 10 : rating === 'hard' ? 6 : 2;
      const coinEarned = isCorrect ? 2 : 0;
      user.xp = (user.xp || 0) + xpEarned;
      user.coins = (user.coins || 0) + coinEarned;

      if (user.lastStudyDate !== todayStr) {
        if (user.lastStudyDate === yesterdayStr) {
          user.streak = (user.streak || 0) + 1;
        } else {
          user.streak = 1;
        }
        user.lastStudyDate = todayStr;
      }

      saveDatabase();
      checkAndUnlockAchievements();
    }

    function checkAndUnlockAchievements() {
      const user = getCurrentUser();
      const metrics = calculateMetrics();
      let newlyUnlocked = false;

      ACHIEVEMENTS_CONFIG.forEach(ach => {
        const exists = db.Achievements.some(a => a.userId === user.id && a.achievementId === ach.id);
        if (!exists && ach.check(metrics)) {
          db.Achievements.push({
            id: 'ua_' + Date.now() + '_' + ach.id,
            userId: user.id,
            achievementId: ach.id,
            unlockedAt: Date.now()
          });
          user.xp = (user.xp || 0) + 25;
          user.coins = (user.coins || 0) + 15;
          showToast(`🏆 ปลดล็อกความสำเร็จ: "${ach.title}" (+25 XP, +15 เหรียญ)`);
          newlyUnlocked = true;
        }
      });

      if (newlyUnlocked) saveDatabase();
    }

    /****************************************************
     * 5. REAL-TIME METRICS COMPUTATION
     ****************************************************/
    function calculateMetrics() {
      const user = getCurrentUser();
      const settings = getCurrentUserSettings();
      const vocabList = getUserJoinedVocabulary();
      const userReviews = db.ReviewHistory.filter(r => r.userId === user.id);
      const userGames = db.GameSessions.filter(g => g.userId === user.id);
      const now = Date.now();
      const todayStr = getBangkokDateStr(now);
      const oneDayMs = 24 * 60 * 60 * 1000;

      let newCount = 0;
      let learningCount = 0;
      let masteredCount = 0; // Stage >= 7
      let dueList = [];
      let overdueList = [];

      vocabList.forEach(v => {
        const st = v.srsStage || 0;
        if (st === 0) newCount++;
        else if (st >= 7) masteredCount++;
        else learningCount++;

        if (st > 0 && v.nextReview && v.nextReview <= now) {
          dueList.push(v);
          if (now - v.nextReview >= oneDayMs || v.urgentReview) {
            overdueList.push(v);
          }
        }
      });

      // Sort Due Queue: Urgent & Overdue & High wrongCount first
      dueList.sort((a, b) => {
        const aScore = (a.urgentReview ? 1e9 : 0) + (now - (a.nextReview || now)) + ((a.wrongCount || 0) * 3600000);
        const bScore = (b.urgentReview ? 1e9 : 0) + (now - (b.nextReview || now)) + ((b.wrongCount || 0) * 3600000);
        return bScore - aScore;
      });

      const totalReviews = userReviews.length;
      const correctReviews = userReviews.filter(r => r.isCorrect).length;
      const accuracy = totalReviews > 0 ? Math.round((correctReviews / totalReviews) * 100) : 0;
      const todayReviews = userReviews.filter(r => r.dateStr === todayStr).length;

      const level = Math.floor((user.xp || 0) / 100) + 1;
      const xpInLevel = (user.xp || 0) % 100;

      return {
        user,
        settings,
        vocabList,
        userReviews,
        userGames,
        totalVocab: vocabList.length,
        newCount,
        learningCount,
        masteredCount,
        dueList,
        overdueList,
        totalReviews,
        accuracy,
        todayReviews,
        level,
        xpInLevel,
        streak: user.streak || 0,
        bossDefeated: user.bossDefeated || 0
      };
    }

    /****************************************************
     * 7. VIEW 1: DASHBOARD
     ****************************************************/
    function renderDashboardView(container, m) {
      const goalTarget = m.settings.dailyGoal || 15;
      const goalPct = Math.min(100, Math.round((m.todayReviews / goalTarget) * 100));

      // 14-Day Activity Calendar in Asia/Bangkok
      const countsByDate = {};
      m.userReviews.forEach(r => {
        if (r.dateStr) countsByDate[r.dateStr] = (countsByDate[r.dateStr] || 0) + 1;
      });
      const calendarDays = [];
      const now = Date.now();
      for (let i = 13; i >= 0; i--) {
        const ts = now - i * 86400000;

    function loadStarterDeck20() {
      const user = getCurrentUser();
      const existingWords = new Set(db.Vocabulary.filter(v => v.ownerId === user.id).map(v => v.word));
      let added = 0;
      const now = Date.now();

      STARTER_DECK_20.forEach((item, idx) => {
        if (!existingWords.has(item.word)) {
          const vid = 'voc_' + now + '_' + idx;
          db.Vocabulary.push({
            id: vid,
            ownerId: user.id,
            language: 'Japanese',
            word: item.word,
            kana: item.kana,
            romaji: item.romaji,
            meaning: item.meaning,
            partOfSpeech: item.partOfSpeech,
            category: item.category,
            jlpt: item.jlpt,
            exampleJa: item.exampleJa,
            exampleTh: item.exampleTh,
            tokens: item.tokens,
            createdAt: now
          });
          db.UserVocabulary.push({
            id: 'uv_' + vid,
            userId: user.id,
            vocabId: vid,
            srsStage: 0,
            nextReview: now,
            lastReviewed: null,
            correctCount: 0,
            wrongCount: 0,
            consecutiveCorrect: 0,
            urgentReview: false
          });
          added++;
        }
      });

      saveDatabase();
      checkAndUnlockAchievements();
      showToast(`โหลดชุดคำศัพท์เริ่มต้นสำเร็จ ${added} คำ!`);
      renderApp();
    }

    function saveVocabForm(e, editId) {
      e.preventDefault();
      const user = getCurrentUser();
      const word = document.getElementById('f-word').value.trim();
      const kana = document.getElementById('f-kana').value.trim();
      const romaji = document.getElementById('f-romaji').value.trim();
      const meaning = document.getElementById('f-meaning').value.trim();
      const partOfSpeech = document.getElementById('f-pos').value;
      const category = document.getElementById('f-cat').value;
      const jlpt = document.getElementById('f-jlpt').value;
      const exampleJa = document.getElementById('f-exja').value.trim();
      const exampleTh = document.getElementById('f-exth').value.trim();
      const tokens = exampleJa ? (exampleJa.match(/.{1,4}/g) || [exampleJa]) : [word];

      if (editId) {
        const v = db.Vocabulary.find(item => item.id === editId);
        if (v && v.ownerId === user.id) {
          Object.assign(v, { word, kana, romaji, meaning, partOfSpeech, category, jlpt, exampleJa, exampleTh, tokens });
          showToast('แก้ไขคำศัพท์เรียบร้อยแล้ว');
        }
      } else {
        const vid = 'voc_' + Date.now();
        db.Vocabulary.push({
          id: vid,
          ownerId: user.id,
          language: 'Japanese',
          word, kana, romaji, meaning, partOfSpeech, category, jlpt, exampleJa, exampleTh, tokens,
          createdAt: Date.now()
        });
        db.UserVocabulary.push({
          id: 'uv_' + vid,
          userId: user.id,
          vocabId: vid,
          srsStage: 0,
          nextReview: Date.now(),
          lastReviewed: null,
          correctCount: 0,
          wrongCount: 0,
          consecutiveCorrect: 0,
          urgentReview: false
        });
        showToast('เพิ่มคำศัพท์ใหม่สำเร็จ!');
      }

      saveDatabase();
      checkAndUnlockAchievements();
      closeModal();
      renderApp();
    }

    function deleteVocabItem(id) {
      const user = getCurrentUser();
      db.Vocabulary = db.Vocabulary.filter(v => !(v.id === id && v.ownerId === user.id));
      db.UserVocabulary = db.UserVocabulary.filter(uv => !(uv.vocabId === id && uv.userId === user.id));
      saveDatabase();
      showToast('ลบคำศัพท์ออกจากคลังแล้ว', 'info');
      renderApp();
    }

    function exportVocabularyCSV() {
      const list = getUserJoinedVocabulary();
      if (!list.length) {
        showToast('ยังไม่มีคำศัพท์ในคลังสำหรับส่งออก', 'error');
        return;
      }
      const header = 'word,kana,romaji,meaning,partOfSpeech,category,jlpt,exampleJa,exampleTh,srsStage';
      const rows = list.map(v => [
        v.word, v.kana, v.romaji, v.meaning, v.partOfSpeech, v.category, v.jlpt, v.exampleJa || '', v.exampleTh || '', v.srsStage || 0
      ].map(col => `"${String(col).replace(/"/g, '""')}"`).join(','));

      const csv = '\uFEFF' + [header, ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `vocab_quest_${getBangkokDateStr()}.csv`;
      a.click();
      showToast('ส่งออกไฟล์ CSV สำเร็จ');
    }

    function processCSVImport() {
      const raw = document.getElementById('csv-input-area').value.trim();
      if (!raw) {
        showToast('กรุณาวางข้อมูล CSV ก่อนนำเข้า', 'error');
        return;
      }
      const user = getCurrentUser();
      const lines = raw.split('\n');
      let added = 0;
      let skipped = 0;

      lines.forEach((line, idx) => {
        const clean = line.trim();
        if (!clean) return;
        if (idx === 0 && clean.toLowerCase().includes('word') && clean.toLowerCase().includes('meaning')) return;
        const cols = clean.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
        if (cols.length >= 4 && cols[0] && cols[3]) {
          const [word, kana, romaji, meaning, partOfSpeech = 'คำนาม (Noun)', category = 'ชีวิตประจำวัน', jlpt = 'N5', exampleJa = '', exampleTh = ''] = cols;
          const vid = 'voc_' + Date.now() + '_' + idx;
          db.Vocabulary.push({
            id: vid,
            ownerId: user.id,
            language: 'Japanese',
            word, kana: kana || word, romaji: romaji || '', meaning,
            partOfSpeech, category, jlpt, exampleJa, exampleTh,
            tokens: exampleJa ? (exampleJa.match(/.{1,4}/g) || [exampleJa]) : [word],
            createdAt: Date.now()
          });
          db.UserVocabulary.push({
            id: 'uv_' + vid,
            userId: user.id,
            vocabId: vid,
            srsStage: 0,
            nextReview: Date.now(),
            lastReviewed: null,
            correctCount: 0,
            wrongCount: 0,
            consecutiveCorrect: 0,
            urgentReview: false
          });
          added++;
        } else {
          skipped++;
        }
      });

      saveDatabase();
      closeModal();
      showToast(`นำเข้าสำเร็จ ${added} คำ ${skipped > 0 ? `(ข้ามข้อมูลไม่ครบ ${skipped} แถว)` : ''}`);
      renderApp();
    }

    function quickStartSRS(mode) {
      activeTab = 'review';
      startSRSSession(mode);
    }

    function startSRSSession(mode) {
      const m = calculateMetrics();
      let pool = [];
      if (mode === 'due') pool = [...m.dueList];
      else if (mode === 'new') pool = m.vocabList.filter(v => v.srsStage === 0);
      else pool = [...m.vocabList];

      if (srsSession.filterCat !== 'ALL') pool = pool.filter(v => v.category === srsSession.filterCat);
      if (srsSession.filterJLPT !== 'ALL') pool = pool.filter(v => v.jlpt === srsSession.filterJLPT);

      if (!pool.length) {
        showToast('ไม่มีคำศัพท์ในคิวตามเงื่อนไขที่เลือก', 'info');
        renderApp();
        return;
      }

      const batchSize = m.settings.batchSize || 10;
      srsSession.active = true;
      srsSession.mode = mode;
      srsSession.queue = pool.slice(0, batchSize);
      srsSession.index = 0;
      srsSession.revealed = false;
      srsSession.results = [];
      renderApp();
    }

    function gradeSRSCard(rating) {
      const card = srsSession.queue[srsSession.index];
      if (!card) return;
      recordReviewResult(card.id, rating, 'srs_review', 8);
      srsSession.results.push({ card, rating });

      if (srsSession.index + 1 < srsSession.queue.length) {
        srsSession.index += 1;
        srsSession.revealed = false;
      } else {
        srsSession.mode = 'summary';
      }
      renderApp();
    }

    function updateSettingField(key, val) {
      const s = getCurrentUserSettings();
      s[key] = val;

    async function requestBrowserNotification() {
      if (!('Notification' in window)) {
        showToast('เบราว์เซอร์นี้ไม่รองรับระบบ Push Notification', 'error');
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        const m = calculateMetrics();
        updateSettingField('notificationsEnabled', true);
        new Notification('Vocabulary Memory Quest', {
          body: `เปิดแจ้งเตือนสำเร็จ! คุณมีคำศัพท์ถึงกำหนดทบทวน ${m.dueList.length} คำ`
        });
        showToast('เปิดใช้งานการแจ้งเตือนสำเร็จ!');
      } else {
        showToast('ไม่ได้รับอนุญาตให้แจ้งเตือน', 'info');
      }
    }

    /****************************************************
     * 10. VIEW 4: 10 MEMORY GAMES ARENA
     ****************************************************/
    function startGame(gameId) {
      const m = calculateMetrics();
      if (m.vocabList.length < 4) {
        showToast('กรุณาเพิ่มคำศัพท์อย่างน้อย 4 คำ (หรือกดโหลดชุดเริ่มต้น 20 คำ) ก่อนเล่นเกม', 'error');
        return;
      }

      // Prioritize due & frequently wrong words for Boss Battle
      let pool = [...m.vocabList];
      if (gameId === 'boss_battle') {
        pool.sort((a, b) => ((b.wrongCount || 0) - (a.wrongCount || 0)));
      } else {
        pool.sort(() => Math.random() - 0.5);
      }
      pool = pool.slice(0, Math.min(8, pool.length));

      gameRuntime = {
        activeGameId: gameId,
        summary: null,
        pool,
        qIndex: 0,
        score: 0,
        mistakes: [],
        startTime: Date.now(),
        timerId: null,
        timeLeft: 60,
        revealed: false,
        feedback: null,
        bossHP: 100,
        playerHP: 100,
        builtTokens: [],
        matchLeft: [],
        matchRight: [],
        selectedLeftId: null,
        matchedIds: [],
        flipDeck: [],
        flippedIdx: [],
        solvedFlipIds: []
      };

      if (gameId === 'matching') {
        const sub = pool.slice(0, 6);
        gameRuntime.matchLeft = [...sub].sort(() => Math.random() - 0.5);
        gameRuntime.matchRight = [...sub].sort(() => Math.random() - 0.5);
      } else if (gameId === 'memory_flip') {
        const sub = pool.slice(0, 4);
        const deck = [];
        sub.forEach(w => {
          deck.push({ uid: w.id + '_ja', vocab: w, label: w.word });
          deck.push({ uid: w.id + '_th', vocab: w, label: w.meaning });
        });
        gameRuntime.flipDeck = deck.sort(() => Math.random() - 0.5);
      } else if (gameId === 'speed_round') {
        gameRuntime.timerId = setInterval(() => {
          gameRuntime.timeLeft -= 1;
          if (gameRuntime.timeLeft <= 0) {
            clearInterval(gameRuntime.timerId);
            gameRuntime.timerId = null;
            finishActiveGame(false);
          } else {
            const timerEl = document.getElementById('speed-timer-badge');
            if (timerEl) timerEl.textContent = `⏱️ ${gameRuntime.timeLeft}s`;
          }
        }, 1000);
      }

      renderApp();
      if (gameId === 'listening' && speechState.supported && pool[0]) {
        speakText(pool[0].word);
      }
    }

    function finishActiveGame(bossWon = false) {
      if (gameRuntime.timerId) {
        clearInterval(gameRuntime.timerId);
        gameRuntime.timerId = null;
      }
      const user = getCurrentUser();
      const durationSec = Math.max(1, Math.round((Date.now() - gameRuntime.startTime) / 1000));

      db.GameSessions.push({
        id: 'gs_' + Date.now(),
        userId: user.id,
        gameId: gameRuntime.activeGameId,
        score: gameRuntime.score,
        durationSec,
        mistakesCount: gameRuntime.mistakes.length,
        timestamp: Date.now(),
        dateStr: getBangkokDateStr()
      });

      const xpBonus = Math.max(5, Math.floor(gameRuntime.score / 10));
      const coinBonus = Math.max(3, Math.floor(gameRuntime.score / 15));
      user.xp = (user.xp || 0) + xpBonus;
      user.coins = (user.coins || 0) + coinBonus;
      if (bossWon) user.bossDefeated = (user.bossDefeated || 0) + 1;

      saveDatabase();
      checkAndUnlockAchievements();

      gameRuntime.summary = {
        gameId: gameRuntime.activeGameId,
        score: gameRuntime.score,
        durationSec,
        mistakes: gameRuntime.mistakes,
        bossWon
      };
      renderApp();
    }

    function submitGameQuestionAnswer(isCorrect) {
      const currentWord = gameRuntime.pool[gameRuntime.qIndex];
      if (!currentWord) return;

      if (isCorrect) gameRuntime.score += 20;
      else gameRuntime.mistakes.push(currentWord);

      recordReviewResult(currentWord.id, isCorrect ? 'good' : 'again', 'game_' + gameRuntime.activeGameId, 5);

      if (gameRuntime.activeGameId === 'boss_battle') {
        if (isCorrect) gameRuntime.bossHP = Math.max(0, gameRuntime.bossHP - 25);
        else gameRuntime.playerHP = Math.max(0, gameRuntime.playerHP - 30);

        if (gameRuntime.bossHP <= 0 || gameRuntime.playerHP <= 0) {
          finishActiveGame(gameRuntime.bossHP <= 0);
          return;
        }
      }

      if (gameRuntime.activeGameId === 'speed_round') {
        gameRuntime.qIndex = (gameRuntime.qIndex + 1) % gameRuntime.pool.length;
        renderApp();
        return;
      }

      gameRuntime.feedback = {
        isCorrect,
        word: currentWord
      };
      renderApp();
    }

    function nextGameQuestion() {
      gameRuntime.feedback = null;
      gameRuntime.revealed = false;
      gameRuntime.builtTokens = [];

      if (gameRuntime.qIndex + 1 < gameRuntime.pool.length) {
        gameRuntime.qIndex += 1;
        renderApp();
        const nextW = gameRuntime.pool[gameRuntime.qIndex];
        if (gameRuntime.activeGameId === 'listening' && speechState.supported && nextW) {
          speakText(nextW.word);
        }
      } else {
        finishActiveGame(gameRuntime.activeGameId === 'boss_battle' && gameRuntime.bossHP <= 25);
      }
    }

    function handleMatchingPairClick(side, id) {
      if (side === 'left') {
        gameRuntime.selectedLeftId = id;
        renderApp();
        return;
      }
      if (!gameRuntime.selectedLeftId) return;
      const leftWord = gameRuntime.matchLeft.find(w => w.id === gameRuntime.selectedLeftId);
      if (gameRuntime.selectedLeftId === id) {
        gameRuntime.matchedIds.push(id);
        gameRuntime.score += 20;
        gameRuntime.selectedLeftId = null;
        recordReviewResult(id, 'good', 'game_matching', 4);
        if (gameRuntime.matchedIds.length === gameRuntime.matchLeft.length) {
          finishActiveGame(false);
          return;
        }
      } else {
        if (leftWord) {
          gameRuntime.mistakes.push(leftWord);
          recordReviewResult(leftWord.id, 'again', 'game_matching', 4);
        }
        gameRuntime.selectedLeftId = null;
        showToast('จับคู่ไม่ตรงกัน ลองใหม่อีกครั้ง!', 'error');
      }
      renderApp();
    }

    function handleMemoryFlipClick(idx) {
      if (gameRuntime.flippedIdx.length >= 2 || gameRuntime.flippedIdx.includes(idx)) return;
      const card = gameRuntime.flipDeck[idx];
      if (!card || gameRuntime.solvedFlipIds.includes(card.vocab.id)) return;

      gameRuntime.flippedIdx.push(idx);
      renderApp();

      if (gameRuntime.flippedIdx.length === 2) {
        const c1 = gameRuntime.flipDeck[gameRuntime.flippedIdx[0]];
        const c2 = gameRuntime.flipDeck[gameRuntime.flippedIdx[1]];
        if (c1.vocab.id === c2.vocab.id) {
          gameRuntime.solvedFlipIds.push(c1.vocab.id);
          gameRuntime.flippedIdx = [];
          gameRuntime.score += 25;
          recordReviewResult(c1.vocab.id, 'good', 'game_memory_flip', 5);
          if (gameRuntime.solvedFlipIds.length === gameRuntime.flipDeck.length / 2) {
            finishActiveGame(false);
            return;
          }
          renderApp();
        } else {
          setTimeout(() => {
            gameRuntime.flippedIdx = [];
            renderApp();
          }, 800);
        }
      }
    }

    function checkTypingGameAnswer() {
      const inp = document.getElementById('game-typing-input');
      if (!inp) return;
      const val = inp.value.trim().toLowerCase();
      const w = gameRuntime.pool[gameRuntime.qIndex];
      const ok = val === (w.word || '').toLowerCase() ||
                 val === (w.kana || '').toLowerCase() ||
                 val === (w.romaji || '').toLowerCase() ||
                 val === (w.meaning || '').toLowerCase();
      submitGameQuestionAnswer(ok);
    }

    function checkSentenceBuilderAnswer() {
      const w = gameRuntime.pool[gameRuntime.qIndex];
      const target = (w.exampleJa || w.word).replace(/\s+/g, '');
      const attempt = gameRuntime.builtTokens.join('').replace(/\s+/g, '');
      submitGameQuestionAnswer(target === attempt);
    }

    function selectOrBuyTheme(themeId) {
      const user = getCurrentUser();
      const s = getCurrentUserSettings();
      const t = THEMES[themeId];
      if (!t) return;

      if (!s.unlockedThemes.includes(themeId)) {
        if ((user.coins || 0) < t.price) {
          showToast('เหรียญของคุณยังไม่พอสำหรับแลกธีมนี้', 'error');
          return;
        }
        user.coins -= t.price;
        s.unlockedThemes.push(themeId);
      }
      s.theme = themeId;
      saveDatabase();
      applyCurrentUserTheme();
      showToast(`เปลี่ยนเป็นธีม ${t.name} สำเร็จ!`);
      renderApp();
    }

          <div class="space-y-2 max-h-60 overflow-y-auto">
            ${db.Users.map(u => `
              <div class="p-3 rounded-2xl border ${u.id === db.currentUserId ? 'bg-theme-sub border-stone-400' : 'bg-white border-theme'} flex items-center justify-between">
                <div>
                  <p class="font-bold text-sm">${escapeHtml(u.username)}</p>
                  <p class="text-[11px] text-stone-500">XP: ${u.xp || 0} • Streak: ${u.streak || 0} วัน</p>
                </div>
                ${u.id === db.currentUserId
                  ? `<span class="px-2.5 py-1 rounded-lg bg-theme-primary font-bold">กำลังใช้งาน</span>`
                  : `<button onclick="switchUserAccount('${u.id}')" class="px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 font-bold">เลือกบัญชีนี้</button>`
                }
              </div>
            `).join('')}
          </div>
          <form onsubmit="createNewUserAccount(event)" class="pt-3 border-t border-stone-100 flex gap-2">
            <input id="new-username-inp" required placeholder="ชื่อโปรไฟล์ผู้เรียนใหม่..." class="flex-1 px-3.5 py-2 rounded-xl border border-theme bg-theme-main" />
            <button type="submit" class="px-4 py-2 rounded-xl bg-theme-primary font-bold">+ สร้างโปรไฟล์</button>
          </form>
        </div>
      `;
    }

    function switchUserAccount(uid) {
      db.currentUserId = uid;
      srsSession.active = false;
      gameRuntime.activeGameId = null;
      saveDatabase();
      applyCurrentUserTheme();
      closeModal();
      showToast('สลับโปรไฟล์ผู้เรียนเรียบร้อยแล้ว');
      renderApp();
    }

    function createNewUserAccount(e) {
      e.preventDefault();
      const name = document.getElementById('new-username-inp').value.trim();
      if (!name) return;
      const uid = 'user_' + Date.now();
      db.Users.push({
        id: uid,
        username: name,
        timezone: 'Asia/Bangkok',
        xp: 0,
        coins: 50,
        streak: 0,
        lastStudyDate: '',
        bossDefeated: 0,
        createdAt: Date.now()
      });
      db.UserSettings.push({
        userId: uid,
        dailyGoal: 15,
        batchSize: 10,
        promptMode: 'word',
        theme: 'matcha',
        unlockedThemes: ['matcha'],
        notificationsEnabled: false
      });
      switchUserAccount(uid);
    }

    function exportFullDatabaseJSON() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `vocab_memory_quest_backup_${getBangkokDateStr()}.json`;
      a.click();
      showToast('ดาวน์โหลดไฟล์สำรองฐานข้อมูล JSON สำเร็จ');
    }

    function importFullDatabaseJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && Array.isArray(parsed.Users) && Array.isArray(parsed.Vocabulary)) {
            db = parsed;
            saveDatabase();
            applyCurrentUserTheme();
            showToast('กู้คืนฐานข้อมูลสำเร็จ!');
            renderApp();
          } else {
            showToast('โครงสร้างไฟล์ JSON ไม่ถูกต้อง', 'error');
          }
        } catch (err) {
          showToast('ไม่สามารถอ่านไฟล์ JSON ได้', 'error');
        }
      };
      reader.readAsText(file);
    }

    function closeModal() {
      const modal = document.getElementById('modal-backdrop');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    /****************************************************
     * 14. UTILITIES & INITIALIZATION
     ****************************************************/
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSpeechSystem();
      loadDatabase();
      renderApp();
    });
  </script>
</body>
</html>
